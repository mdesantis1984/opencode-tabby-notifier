name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run test:tabby
      - run: npm run harness:ipc
      - run: npm run harness:os
      - run: npm run harness:telegram
      - run: npm run harness:tabby
      - name: Check Tabby DOM verifier applicability
        shell: bash
        run: |
          if test -x /opt/Tabby/tabby; then
            npm run harness:tabby:dom
          else
            echo "::notice title=Tabby DOM verifier unavailable::The hosted runner has no /opt/Tabby/tabby executable."
            echo "Tabby DOM verifier unavailable on the hosted runner; remains a required local release gate." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install pinned OpenCode CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode" --legacy-peer-deps opencode-ai@1.18.26
          echo "$RUNNER_TEMP/opencode/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify pinned OpenCode SSE harness
        env:
          OPENCODE_EXPECTED_VERSION: 1.18.26
        run: npm run harness:opencode:server
      - run: npm run typecheck
      - run: npm run build:tabby
      - run: npm run audit:production
      - run: npm pack --dry-run --json
      - run: npm pack --workspace tabby-plugin --dry-run --json
  windows:
    runs-on: windows-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run test:tabby
      - run: npm run typecheck
      - run: npm run build:tabby
