name: PR policy

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GitFlow route and metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const source = pr.head.ref
            const base = pr.base.ref
            const shortLived = /^(feat|fix|chore|docs|style|refactor|perf|test|build|ci)\/[a-z0-9._-]+$/
            const dependabot = /^dependabot\/[a-z0-9._\/-]+$/
            const release = /^(release|hotfix)\/[a-z0-9._-]+$/

            const routeAllowed = base === "develop"
              ? shortLived.test(source) || dependabot.test(source) || source === "main"
              : base === "main" && (source === "develop" || release.test(source))
            if (!routeAllowed) {
              core.setFailed(`Invalid GitFlow route: ${source} -> ${base}`)
              return
            }

            const typeLabels = pr.labels
              .map(label => label.name)
              .filter(name => name.startsWith("type:"))
            if (typeLabels.length !== 1) {
              core.setFailed(`Expected exactly one type:* label, found ${typeLabels.length}`)
              return
            }

            const issueNumbers = [...new Set(
              [...(pr.body ?? "").matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)]
                .map(match => Number(match[1])),
            )]
            if (issueNumbers.length === 0) {
              core.setFailed("PR body must link an approved issue with Closes/Fixes/Resolves #N")
              return
            }

            for (const issueNumber of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              })
              const labels = issue.labels.map(label => typeof label === "string" ? label : label.name)
              if (issue.pull_request || !labels.includes("status:approved")) {
                core.setFailed(`Linked #${issueNumber} is not an approved issue`)
                return
              }
            }

            core.info(`Validated ${source} -> ${base}, ${typeLabels[0]}, issues ${issueNumbers.join(", ")}`)
